name: Feature
description: Proponer una mejora o funcionalidad
title: 'feat: '
labels: ['type:feat']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema o necesidad
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: En Gherkin si es posible (Dado / Cuando / Entonces).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - web
        - api
        - db
        - infra
        - docs
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: ID en Tareas.md
      placeholder: OPR-123
